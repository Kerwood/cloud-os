modules:
  - type: script
    scripts:
      - setup-vscode-repo.sh
      - setup-google-chrome-repo.sh
      - install-netbird.sh
      #- install-jetbrains-toolbox.sh
      #- install-app-image-launcher.sh

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/ryanabx/cosmic-epoch/repo/fedora-%OS_VERSION%/ryanabx-cosmic-epoch-fedora-%OS_VERSION%.repo
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      - https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-%OS_VERSION%/scottames-ghostty-fedora-%OS_VERSION%.repo
    # /opt is a symlink to the mutable /var/opt, so anything an RPM installs there is
    # lost from the image. optfix moves /opt/<dir> into /usr/lib/opt/<dir> and links it back at boot.
    optfix:
      - google
      - brave.com
    install:
      - google-chrome-stable
      - brave-browser
      - alacritty
      - ghostty
      - code
      - wireshark
      - ulauncher
      - wmctrl # Ulauncher/Wayland dependency
      - flameshot
      - papirus-icon-theme
      - gnome-extensions-app
      - gnome-calculator
      - loupe # Image Viewer
      - evince # Document Viewer
      - sushi # Quick previewer for Nautilus
      - snapshot
      - netbird-ui
      - gnome-shell-extension-appindicator # Tray icon support, needed by netbird-ui
      - cosmic-desktop

  - type: default-flatpaks
    configurations:
    - notify: true
      scope: user
      install:
        - com.github.tchx84.Flatseal
        - com.spotify.Client
        - com.discordapp.Discord

  - type: script
    scripts:
      - google-chrome-stable-symlink.sh
